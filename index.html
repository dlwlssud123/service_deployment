<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whattoeat.shop - 데이터 기반 음식 추천</title>
    
    <!-- PWA / App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .roulette-box {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .slide-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .modal-overlay { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <h1 class="text-xl font-black tracking-tighter text-orange-600 uppercase">whattoeat.shop</h1>
            <div class="flex items-center space-x-2">
                <button onclick="openHistoryModal()" class="p-2 text-slate-400 hover:text-slate-900"><i class="fa-solid fa-clock-rotate-left"></i></button>
                <div class="text-[9px] font-bold text-slate-400 border border-slate-200 px-2 py-1 rounded-full uppercase tracking-widest">v2.5 Stable</div>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-10 space-y-10 sm:space-y-14">
        
        <!-- Section 1: Recommendation -->
        <section class="space-y-6 sm:space-y-8 animate-fade">
            <div class="space-y-1">
                <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight">오늘의 메뉴 추천</h2>
                <p class="text-slate-500 text-xs sm:text-sm">결정 장애를 해결해 드립니다.</p>
            </div>

            <!-- Time Selection -->
            <div class="flex flex-wrap gap-2 pb-2">
                <button onclick="selectTime('아침', this)" class="time-btn px-4 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">아침</button>
                <button onclick="selectTime('점심', this)" class="time-btn px-4 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">점심</button>
                <button onclick="selectTime('간식', this)" class="time-btn px-4 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">간식</button>
                <button onclick="selectTime('저녁', this)" class="time-btn px-4 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">저녁</button>
                <button onclick="selectTime('야식', this)" class="time-btn px-4 py-2 rounded-xl border border-slate-200 bg-white text-xs font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">야식</button>
            </div>

            <!-- Category Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 sm:gap-3">
                <button onclick="selectCategory('한식', this)" class="cat-btn py-3 sm:py-4 rounded-2xl border border-slate-200 bg-white text-sm font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">한식</button>
                <button onclick="selectCategory('중식', this)" class="cat-btn py-3 sm:py-4 rounded-2xl border border-slate-200 bg-white text-sm font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">중식</button>
                <button onclick="selectCategory('일식', this)" class="cat-btn py-3 sm:py-4 rounded-2xl border border-slate-200 bg-white text-sm font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">일식</button>
                <button onclick="selectCategory('양식', this)" class="cat-btn py-3 sm:py-4 rounded-2xl border border-slate-200 bg-white text-sm font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">양식</button>
                <button onclick="selectCategory('디저트', this)" class="cat-btn py-3 sm:py-4 rounded-2xl border border-slate-200 bg-white text-sm font-bold hover:border-orange-500 transition-all active:scale-95 shadow-sm">디저트</button>
            </div>

            <!-- Roulette -->
            <div class="roulette-box rounded-[2rem] p-8 sm:p-12 border border-slate-200 text-center space-y-8 shadow-sm">
                <div id="result-display" class="text-2xl sm:text-4xl font-black text-slate-300 break-keep min-h-[4rem] flex items-center justify-center">메뉴를 선택해주세요</div>
                <button onclick="runRoulette()" id="main-btn" class="w-full py-4 bg-orange-500 text-white rounded-2xl font-black text-base sm:text-xl hover:bg-orange-600 transition-all shadow-lg shadow-orange-100 disabled:opacity-50 active:scale-95">
                    지금 바로 뽑기
                </button>
            </div>
        </section>

        <!-- Section 2: Single Column Slider (SEO Content) -->
        <section class="space-y-5 sm:space-y-6 animate-fade" style="animation-delay: 0.1s;">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-base sm:text-lg font-bold flex items-center">
                    <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full mr-2"></span>
                    미식 칼럼
                </h2>
                <div class="text-[9px] font-bold text-slate-300 uppercase tracking-widest italic">AI Daily Update</div>
            </div>

            <div id="column-container" class="relative min-h-[160px] sm:min-h-[180px]">
                <div id="slider-content" class="w-full">
                    <!-- Cards injected by app.js -->
                </div>
            </div>
        </section>

        <!-- Section 3: Advertisement -->
        <section class="animate-fade" style="animation-delay: 0.2s;">
            <div id="ad-space" class="w-full py-2 bg-slate-50 rounded-2xl border border-dashed border-slate-200 flex items-center justify-center">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                     data-ad-slot="XXXXXXXXXX"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>
        </section>

    </main>

    <footer class="max-w-2xl mx-auto px-6 py-12 border-t border-slate-200 text-center space-y-3">
        <p class="text-[10px] text-slate-400 font-medium tracking-tight uppercase">whattoeat.shop | AI-Powered Solution</p>
        <p class="text-[10px] text-slate-300 font-light">"데이터로 더 나은 선택을 만듭니다."</p>
    </footer>

    <!-- Column Detail Modal -->
    <div id="column-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay transition-all">
        <div id="column-modal-box" class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden transform scale-95 opacity-0 transition-all duration-300">
            <div class="p-6 sm:p-8 space-y-6">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest" id="modal-date">AI Magazine</span>
                        <h2 class="text-xl sm:text-2xl font-black text-slate-900 mt-1 leading-tight" id="modal-title">칼럼 제목</h2>
                    </div>
                    <button onclick="closeColumnModal()" class="p-2 text-slate-400 hover:text-slate-900"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div class="w-12 h-1 bg-indigo-500 rounded-full"></div>
                <div id="modal-content" class="text-slate-600 text-sm sm:text-base leading-relaxed whitespace-pre-wrap max-h-[60vh] overflow-y-auto pr-2">
                    내용...
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay transition-all">
        <div id="history-modal-box" class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden transform scale-95 opacity-0 transition-all">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold">최근 추천 히스토리</h3>
                    <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-900"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div id="history-list" class="space-y-2 max-h-[50vh] overflow-y-auto">
                    <!-- History items -->
                </div>
                <button onclick="clearHistory()" class="w-full mt-6 py-3 text-xs font-bold text-slate-400 hover:text-red-500 transition-colors uppercase italic">Clear All History</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
