<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whattoeat - 오늘 뭐 먹지?</title>
    
    <!-- PWA / App Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- GA & AdSense -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .gradient-text { background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .tab-content { display: none; animation: fadeIn 0.4s ease-out forwards; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .shuffling { opacity: 0.7; transform: scale(0.96) !important; filter: blur(1px); }
        .modal-overlay { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navigation (Simple Top Nav) -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-2xl font-extrabold gradient-text tracking-tighter cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">whattoeat</h1>
            <div class="flex space-x-2">
                <button id="view-history-btn-top" class="p-2 text-slate-500 hover:text-slate-900 transition-all"><i class="fa-solid fa-clock-rotate-left text-xl"></i></button>
                <button id="view-bookmark-btn-top" class="p-2 text-slate-500 hover:text-slate-900 transition-all"><i class="fa-solid fa-star text-xl"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-32">
        
        <!-- Tab 1: Recommendation Section -->
        <section id="recommend-section" class="tab-content active space-y-8">
            <div class="text-center space-y-2">
                <h2 class="text-3xl font-bold">결정 장애 해결사 🎲</h2>
                <p class="text-slate-500">시간대와 음식 카테고리를 골라보세요.</p>
            </div>

            <!-- 1단계: 시간대 -->
            <div class="space-y-3">
                <h3 class="text-lg font-bold text-slate-700 px-1">1단계: 언제 드실 건가요? 🕒</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="time-tabs">
                    <!-- JS Injects Here -->
                </div>
            </div>

            <!-- 2단계: 카테고리 -->
            <div class="space-y-3" id="type-section-container">
                <h3 class="text-lg font-bold text-slate-700 px-1">2단계: 어떤 종류가 땡기나요? 🥘</h3>
                <div class="grid grid-cols-3 md:grid-cols-6 gap-2" id="type-tabs">
                    <!-- JS Injects Here -->
                </div>
            </div>

            <!-- 룰렛 & 결과 구역 -->
            <div class="bg-white rounded-3xl p-8 card-shadow text-center space-y-5">
                <!-- 결과 태그 -->
                <div class="flex justify-center items-center space-x-2 h-6" id="result-tags"></div>

                <div class="roulette-container relative h-32 overflow-hidden rounded-xl bg-slate-50 border border-slate-100 flex flex-col items-center justify-center p-4">
                    <div id="result-emoji" class="text-4xl mb-2 hidden"></div>
                    <div id="roulette-display" class="text-3xl md:text-4xl font-extrabold text-orange-600 transition-all duration-100">결정하기!</div>
                </div>
                
                <div class="pt-2">
                    <button id="draw-btn" class="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl font-bold text-xl shadow-lg shadow-orange-200 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        오늘의 메뉴 뽑기
                    </button>
                    
                    <div class="grid grid-cols-2 gap-3 mt-4 hidden" id="action-buttons">
                        <button id="naver-search-btn" class="py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl font-bold transition-all shadow-md active:scale-95">맛집 검색 🔍</button>
                        <button id="bookmark-btn" class="py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-all border border-slate-200 active:scale-95">즐겨찾기 🤍</button>
                    </div>
                </div>
            </div>

            <!-- History Actions -->
            <div class="flex flex-wrap justify-center gap-3">
                <button id="view-history-btn" class="text-sm font-semibold text-slate-500 hover:text-slate-800 transition-all bg-white px-5 py-2.5 rounded-full border border-slate-200 shadow-sm whitespace-nowrap"><i class="fa-solid fa-clock-rotate-left mr-1"></i> 최근 히스토리</button>
                <button id="view-bookmark-btn" class="text-sm font-semibold text-slate-500 hover:text-slate-800 transition-all bg-white px-5 py-2.5 rounded-full border border-slate-200 shadow-sm whitespace-nowrap"><i class="fa-solid fa-star mr-1"></i> 북마크 모아보기</button>
            </div>

            <!-- AdSense Unit -->
            <div class="w-full mt-8 overflow-hidden rounded-2xl bg-white border border-slate-100 min-h-[100px] flex items-center justify-center">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                     data-ad-slot="1234567890"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </section>

            <!-- AdSense Unit (Strategy: In-between Card and Columns) -->
            <div class="w-full mt-10 overflow-hidden rounded-3xl bg-white border border-slate-100 min-h-[100px] flex flex-col items-center justify-center p-4">
                <p class="text-[10px] text-slate-300 mb-2 uppercase tracking-widest font-bold">Sponsored Information</p>
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXXX"
                     data-ad-slot="XXXXXXXXXX"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <!-- AI Food Column Section -->
            <div class="space-y-4 pt-4">
                <div class="flex items-center justify-between px-1">
                    <h3 class="text-xl font-extrabold text-slate-800">전통과 현대의 맛, 푸드 매거진 📖</h3>
                </div>

                <div class="relative overflow-hidden" id="carousel-container">
                    <div id="column-list" class="flex">
                        <!-- Featured Column Cards Injected Here -->
                    </div>
                </div>

                <!-- Carousel Dots -->
                <div id="carousel-dots" class="flex justify-center space-x-1.5 pt-2"></div>
            </div>

            <div id="ai-loading" class="hidden text-center py-10 bg-white rounded-3xl border border-slate-100 card-shadow">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-4"></div>
                <p class="text-indigo-600 font-bold mb-1">AI 셰프가 맛있는 글을 짓고 있습니다 🍳</p>
                <p class="text-slate-400 text-sm">약 5~10초 소요됩니다</p>
            </div>
        </section>

    </main>

    <!-- Modal for History / Bookmark -->
    <div id="list-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden card-shadow transform transition-all scale-95 opacity-0" id="modal-box">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-white">
                <h3 id="modal-title" class="font-bold text-lg text-slate-800">기록</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-red-500 text-2xl font-bold leading-none">&times;</button>
            </div>
            <ul id="modal-list" class="max-h-[60vh] overflow-y-auto p-2 space-y-1 bg-slate-50/50">
                <!-- Items injected here -->
            </ul>
            <div class="p-4 border-t border-slate-100 bg-white text-right">
                <button id="clear-list-btn" class="text-sm font-semibold text-slate-500 hover:text-red-600 px-3 py-1 bg-slate-100 hover:bg-red-50 rounded-lg transition-all">전체 삭제 (초기화)</button>
            </div>
        </div>
    </div>

    <footer class="max-w-4xl mx-auto px-4 py-8 border-t border-slate-200 mt-8 text-center text-slate-400 text-sm">
        <p>© 2026 whattoeat.shop | AI 기반 메뉴 추천 시스템</p>
        <p class="mt-2 text-xs">프론트엔드: Vanilla JS + Tailwind CSS</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
