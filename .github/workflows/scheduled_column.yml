name: Weekly AI Column Generator

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC (9:00 AM KST)
  workflow_dispatch: # Allow manual run

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Column
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate_column.js

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/columns.json
          git commit -m "chore: auto-generate weekly AI column" || echo "No changes to commit"
          git push
