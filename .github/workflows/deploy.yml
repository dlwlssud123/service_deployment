name: Deploy to GCP

on:
  push:
    branches:
      - main # main 브랜치에 코드가 push될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 커밋된 코드 체크아웃
        uses: actions/checkout@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/menu-recommend-app:latest

      - name: GCP 서버(VM) 접속 및 컨테이너 재설정 (Deploy)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}        # GCP 인스턴스의 public IP
          username: ${{ secrets.GCP_VM_USER }}    # SSH 접속 유저(예: ubuntu)
          key: ${{ secrets.GCP_SSH_KEY }}         # SSH Private Key
          script: |
            # 1. 최신 이미지 Pull
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/menu-recommend-app:latest
            
            # 2. 기존 실행 중인 컨테이너 중지 및 삭제 (존재할 경우에만)
            sudo docker stop menu-app || true
            sudo docker rm menu-app || true
            
            # 3. 새로운 컨테이너 실행 (80번 포트 연결)
            # 호스트의 80 포트를 도커의 80 포트에 매핑
            sudo docker run -d --name menu-app -p 80:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/menu-recommend-app:latest
            
            # 안 쓰이는 예전 이미지 정리(dangling image 삭제)
            sudo docker image prune -f
