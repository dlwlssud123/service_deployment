name: Deploy to GCP

on:
  push:
    branches:
      - master # master 브랜치에 코드가 push될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 커밋된 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/menu-app:latest

      - name: GCP 서버(VM) 접속 및 컨테이너 재설정 (Deploy)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}        # GCP 인스턴스의 public IP
          username: ${{ secrets.GCP_VM_USER }}    # SSH 접속 유저(예: ubuntu)
          key: ${{ secrets.GCP_SSH_KEY }}         # SSH Private Key
          script: |
            # 1. 최신 이미지 Pull (이름 통일: menu-app)
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/menu-app:latest
            
            # 2. 기존 실행 중인 컨테이너 중지 및 삭제
            sudo docker stop menu-app || true
            sudo docker rm menu-app || true
            
            # 3. 새로운 컨테이너 실행 (80번, 443번 포트 연결 + 인증서 볼륨 마운트)
            sudo docker run -d --name menu-app \
              -p 80:80 -p 443:443 \
              -v ~/whattoeat/certs:/etc/nginx/certs:ro \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/menu-app:latest
            
            # 안 쓰이는 예전 이미지 정리(dangling image 삭제)
            sudo docker image prune -f
