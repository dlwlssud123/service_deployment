<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미식 칼럼 - whattoeat.shop</title>
    <meta name="description" content="whattoeat.shop의 미식 칼럼 - 음식 심리학, 영양학, 식문화에 대한 전문 분석">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="whattoeat.shop">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
        .article-content h3 { font-size: 1.15rem; font-weight: 800; color: #1e293b; margin-top: 2rem; margin-bottom: 0.75rem; }
        .article-content p { margin-bottom: 1.25rem; }
        .article-content strong { color: #f97316; font-weight: 800; }
        .article-content { white-space: normal; }
        .share-btn { transition: all 0.2s ease; }
        .share-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black tracking-tighter text-orange-600 uppercase hover:text-orange-700 transition-colors">whattoeat.shop</a>
            <nav class="flex items-center space-x-4">
                <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-orange-600 transition-colors">홈</a>
                <a href="columns.html" class="text-xs font-bold text-orange-600 transition-colors">칼럼</a>
                <a href="about.html" class="text-xs font-bold text-slate-500 hover:text-orange-600 transition-colors">소개</a>
            </nav>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-12">

        <!-- Article Container -->
        <article id="article-container" class="animate-fade">
            <!-- Content will be injected by JS -->
        </article>

        <!-- SNS Share Section -->
        <section id="share-section" class="mt-10 pt-8 border-t border-slate-200 hidden animate-fade" style="animation-delay: 0.1s;">
            <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">이 칼럼 공유하기</h3>
            <div class="flex justify-center space-x-3">
                <button onclick="shareX()" class="share-btn w-10 h-10 rounded-full bg-black text-white flex items-center justify-center shadow-md hover:shadow-lg" title="X (구 트위터) 공유">
                    <i class="fa-brands fa-x-twitter text-sm"></i>
                </button>
                <button onclick="shareInstagram()" class="share-btn w-10 h-10 rounded-full bg-gradient-to-tr from-[#f9ce34] via-[#ee2a7b] to-[#6228d7] text-white flex items-center justify-center shadow-md hover:shadow-lg" title="인스타그램 공유">
                    <i class="fa-brands fa-instagram text-sm"></i>
                </button>
                <button onclick="shareKakao()" class="share-btn w-10 h-10 rounded-full bg-[#FEE500] text-slate-900 flex items-center justify-center shadow-md hover:shadow-lg" title="카카오톡 공유">
                    <i class="fa-solid fa-comment text-sm"></i>
                </button>
                <button onclick="copyLink()" id="copy-btn" class="share-btn w-10 h-10 rounded-full bg-slate-700 text-white flex items-center justify-center shadow-md hover:shadow-lg" title="링크 복사">
                    <i class="fa-solid fa-link text-sm"></i>
                </button>
                <button onclick="shareNative()" class="share-btn w-10 h-10 rounded-full bg-gradient-to-br from-orange-500 to-pink-500 text-white flex items-center justify-center shadow-md hover:shadow-lg" title="공유">
                    <i class="fa-solid fa-share-nodes text-sm"></i>
                </button>
            </div>
            <p id="copy-message" class="text-center text-xs text-green-500 font-bold mt-3 opacity-0 transition-opacity">링크가 복사되었습니다!</p>
        </section>

        <!-- Navigation -->
        <section class="mt-10 flex items-center justify-between animate-fade" style="animation-delay: 0.2s;">
            <a id="prev-link" href="#" class="text-sm font-bold text-slate-400 hover:text-indigo-600 transition-colors hidden">
                <i class="fa-solid fa-arrow-left mr-1"></i> 이전 칼럼
            </a>
            <a href="columns.html" class="text-sm font-bold text-indigo-500 hover:text-indigo-700 transition-colors mx-auto">
                <i class="fa-solid fa-list mr-1"></i> 전체 칼럼 보기
            </a>
            <a id="next-link" href="#" class="text-sm font-bold text-slate-400 hover:text-indigo-600 transition-colors hidden">
                다음 칼럼 <i class="fa-solid fa-arrow-right ml-1"></i>
            </a>
        </section>

    </main>
    <footer class="max-w-2xl mx-auto px-6 py-12 border-t border-slate-200 space-y-6">
        <div class="text-center space-y-3">
            <p class="text-[10px] text-slate-400 font-medium tracking-tight uppercase">whattoeat.shop | AI-Powered Food Recommendation</p>
            <p class="text-[10px] text-slate-300 font-light">"당신의 맛있는 하루를 응원합니다."</p>
        </div>
        <div class="flex flex-wrap justify-center gap-x-4 gap-y-2 text-[10px]">
            <a href="index.html" class="text-slate-400 font-bold underline hover:text-orange-600 transition-colors uppercase">Home</a>
            <a href="columns.html" class="text-slate-400 font-bold underline hover:text-orange-600 transition-colors uppercase">Columns</a>
            <a href="about.html" class="text-slate-400 font-bold underline hover:text-orange-600 transition-colors uppercase">About</a>
            <a href="contact.html" class="text-slate-400 font-bold underline hover:text-orange-600 transition-colors uppercase">Contact</a>
            <a href="privacy.html" class="text-slate-400 font-bold underline hover:text-orange-600 transition-colors uppercase">Privacy</a>
            <a href="terms.html" class="text-slate-400 font-bold underline hover:text-orange-600 transition-colors uppercase">Terms</a>
        </div>
        <div class="text-center pt-2">
            <a href="mailto:vbnm963245@gmail.com" class="text-[10px] text-slate-400 hover:text-orange-600 transition-colors">
                <i class="fa-solid fa-envelope mr-1"></i>vbnm963245@gmail.com
            </a>
        </div>
    </footer>

    </footer>

    <script>
        let currentColumn = null;
        let allColumns = [];

        async function loadColumn() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));

            try {
                const response = await fetch('data/columns.json?v=' + new Date().getTime());
                allColumns = await response.json();
                const columnIndex = allColumns.findIndex(c => c.id === id);
                currentColumn = allColumns[columnIndex];

                if (!currentColumn) {
                    showNotFound();
                    return;
                }

                // Update page meta
                document.title = `${currentColumn.title} - whattoeat.shop 미식 칼럼`;
                document.querySelector('meta[name="description"]').content = currentColumn.content.substring(0, 160);
                
                // Update OG tags
                const ogTitle = document.querySelector('meta[property="og:title"]');
                if (!ogTitle) {
                    const meta = document.createElement('meta');
                    meta.setAttribute('property', 'og:title');
                    meta.content = currentColumn.title;
                    document.head.appendChild(meta);
                }

                // Render article
                const container = document.getElementById('article-container');
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="space-y-3">
                            <div class="flex items-center space-x-3">
                                <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest">${currentColumn.date || 'AI Magazine'}</span>
                                <span class="w-1 h-1 bg-slate-300 rounded-full"></span>
                                <span class="text-[10px] font-medium text-slate-400">AI 분석 칼럼</span>
                            </div>
                            <h1 class="text-2xl sm:text-3xl font-black tracking-tight leading-tight text-slate-900">${currentColumn.title}</h1>
                        </div>
                        <div class="w-16 h-1 bg-indigo-500 rounded-full"></div>
                        <div class="article-content text-slate-600 text-sm sm:text-base leading-[1.9] sm:leading-[2]">${marked.parse(currentColumn.content)}</div>
                    </div>
                `;

                // Show share section
                document.getElementById('share-section').classList.remove('hidden');

                // Setup navigation
                if (columnIndex < allColumns.length - 1) {
                    const prevLink = document.getElementById('prev-link');
                    prevLink.href = `column.html?id=${allColumns[columnIndex + 1].id}`;
                    prevLink.classList.remove('hidden');
                }
                if (columnIndex > 0) {
                    const nextLink = document.getElementById('next-link');
                    nextLink.href = `column.html?id=${allColumns[columnIndex - 1].id}`;
                    nextLink.classList.remove('hidden');
                }

            } catch (error) {
                console.error('Failed to load column:', error);
                showNotFound();
            }
        }

        function showNotFound() {
            document.getElementById('article-container').innerHTML = `
                <div class="text-center py-20 space-y-4">
                    <p class="text-6xl">🍽️</p>
                    <h2 class="text-xl font-bold text-slate-700">칼럼을 찾을 수 없습니다</h2>
                    <p class="text-sm text-slate-500">요청하신 칼럼이 존재하지 않습니다.</p>
                    <a href="columns.html" class="inline-block mt-4 px-6 py-3 bg-indigo-500 text-white rounded-xl font-bold text-sm hover:bg-indigo-600 transition-all">전체 칼럼 보기</a>
                </div>
            `;
        }

        // SNS Share functions
        function getShareUrl() {
            return window.location.href;
        }

        function getShareText() {
            return currentColumn ? `${currentColumn.title} - whattoeat.shop 미식 칼럼` : 'whattoeat.shop 미식 칼럼';
        }

        function shareX() {
            const text = getShareText();
            const url = "https://whattoeat.shop/column.html" + window.location.search;
            const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
            const win = window.open(xUrl, '_blank', 'width=600,height=400');
            if (!win) {
                alert("팝업이 차단되었습니다. 공유 링크를 복사합니다.");
                copyLink();
            }
        }

        function shareInstagram() {
            if (navigator.share) {
                navigator.share({
                    title: getShareText(),
                    url: "https://whattoeat.shop/column.html" + window.location.search
                }).catch(() => copyLink());
            } else {
                copyLink();
            }
        }

        function shareKakao() {
            const url = "https://whattoeat.shop/column.html" + window.location.search;
            const kakaoUrl = `https://sharer.kakao.com/talk/friends/picker/link?url=${encodeURIComponent(url)}`;
            const win = window.open(kakaoUrl, '_blank', 'width=600,height=400');
            if (!win) {
                alert("팝업이 차단되었습니다. 공유 링크를 복사합니다.");
                copyLink();
            }
        }

        function copyLink() {
            navigator.clipboard.writeText(getShareUrl()).then(() => {
                const msg = document.getElementById('copy-message');
                msg.classList.remove('opacity-0');
                msg.classList.add('opacity-100');
                setTimeout(() => {
                    msg.classList.remove('opacity-100');
                    msg.classList.add('opacity-0');
                }, 2000);
            });
        }

        function shareNative() {
            if (navigator.share) {
                navigator.share({
                    title: getShareText(),
                    url: getShareUrl()
                }).catch(() => {});
            } else {
                copyLink();
            }
        }

        loadColumn();
    </script>
</body>
</html>
